name: ledective
description: Bir telefonun içinde geçen dedektif oyunu.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  one_clock: ^2.0.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  table_calendar: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/apps/notesApp/notesAppNotes.json
    - assets/apps/pian/pian_notes/
    - assets/apps/photosApp/images/
    - assets/contacts/
